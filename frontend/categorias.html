<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>

<main class="contenido-pagina">

    <div class="card-principal">

        <!-- HEADER -->
        <div class="header-estudiantes">

            <div class="header-texto">
                <h1>Gestión de Categorías</h1>
                <p>Administra todas las categorías registradas</p>
            </div>

            <div class="header-acciones">
                <div class="buscador-contenedor">
                    <span class="icono-busqueda">🔍</span>
                    <input type="text" id="buscarCategoria" placeholder="Buscar categoría..." onkeyup="filtrarCategorias()">
                </div>

                <button class="btn-nuevo" onclick="abrirModal()">
                    + Nueva Categoría
                </button>
            </div>

        </div>

        <!-- HEADER TABLA -->
        <div class="tabla-header">
            <span>Nombre de la Categoría</span>
            <span>Precio</span>
            <span>Acciones</span>
        </div>

        <!-- LISTA -->
        <div id="contenedor-categorias"></div>

    </div>

</main>

<!-- MODAL -->
<div id="modalCategoria" class="modal">
    <div class="modal-contenido">

        <span class="cerrar" onclick="cerrarModal()">×</span>

        <h2 id="tituloModal">Nueva Categoría</h2>

        <form id="formCategoria">
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="number" id="precio" placeholder="Precio" required step="0.01">
            <button type="submit" class="btn-guardar">Guardar</button>
        </form>

    </div>
</div>

<script src="js/categorias.js"></script>
<script src="js/main.js"></script>

</body>
</html>

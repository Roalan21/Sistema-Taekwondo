<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Taekwondo</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="contenido-pagina">
        <div class="card-principal">
            <!-- Encabezado -->
            <div class="header-estudiantes">
                <div class="header-texto">
                    <h1>Catálogo e Inventario 📦</h1>
                    <p>Administra los artículos disponibles y controla el stock en tiempo real.</p>
                </div>
            </div>
            <div class="buscador">

                <input
                    type="text"
                    id="buscarProducto"
                    placeholder="🔍 Buscar producto..."
                >

            </div>
            <!-- Sección del Formulario -->
            <div class="form-seccion">
                <h3>Registrar Nuevo Producto</h3>
                <form id="formProducto" class="grid-form">
                    <div class="input-group">
                        <label for="nombre">Nombre del Producto</label>
                        <input type="text" id="nombre" placeholder="Ej. Uniforme Dobok" required>
                    </div>

                    <div class="input-group">
                        <label for="descripcion">Descripción</label>
                        <input type="text" id="descripcion" placeholder="Ej. Talla M, algodón 100%">
                    </div>

                    <div class="input-group">
                        <label for="precio">Precio de Venta (C$)</label>
                        <input type="number" id="precio" step="0.01" min="0" placeholder="0.00" required>
                    </div>

                    <div class="input-group" style="display: flex; align-items: flex-end;">
                        <button type="submit" class="btn-nuevo" style="width: 100%; justify-content: center;">
                            Guardar en Catálogo
                        </button>
                    </div>
                </form>
            </div>

            <!-- Listado de Productos -->
            <div class="tabla-contenedor">
                <div class="tabla-header" style="grid-template-columns: 2fr 2fr 1fr 1fr auto;">
    <span>Producto</span>
    <span>Descripción</span>
    <span>Precio</span>
    <span>Stock Actual</span>
    <span>Acciones</span>
</div>
                
                <div id="cuerpoTablaProductos">
                    <!-- Las filas se cargarán dinámicamente -->
                    <div class="sin-resultados">Cargando catálogo de productos...</div>
                </div>
            </div>
        </div>
    </div>
    <div id="modalEditar" class="modal">

    <div class="modal-contenido">

            <div class="modal-header">

                <h2>
                    ✏️ Editar producto
                </h2>

                <button
                    class="btn-cerrar"
                    onclick="cerrarModal()"
                >
                    ✖
                </button>

            </div>

            <div class="modal-body">

                <input
                    type="hidden"
                    id="editarProductoID"
                >

                <input
                    type="text"
                    id="editarNombre"
                    placeholder="Nombre"
                >

                <textarea
                    id="editarDescripcion"
                    placeholder="Descripción"
                ></textarea>

                <input
                    type="number"
                    id="editarPrecio"
                    placeholder="Precio"
                >

                <button
                    class="btn-guardar-modal"
                    onclick="guardarEdicion()"
                >
                    💾 Guardar cambios
                </button>

            </div>

        </div>

    </div>

    <!-- Scripts -->
     <script src="js/alertas.js"></script>
    <script src="js/main.js"></script>
    <script src="js/producto.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>

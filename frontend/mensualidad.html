<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mensualidades - Taekwondo</title>

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>

<div class="contenido-pagina">

    <div class="card-principal">

        <!-- HEADER -->
        <div class="header-estudiantes">

            <div class="header-texto">

                <h1>
                    Gestión de Mensualidades
                </h1>

                <p>
                    Consulta las mensualidades pendientes y pagadas
                    de los estudiantes.
                </p>

            </div>

        </div>
        <div class="filtros-estado">

            <button
                class="btn-filtro activo-verde active"
                data-filtro="pendientes">

                📋 Pendientes

            </button>

            <button
                class="btn-filtro inactivo-rojo"
                data-filtro="vencidas">

                ⏰ Vencidas

            </button>

            <button
                class="btn-filtro"
                data-filtro="pagadas">

                💰 Pagadas

            </button>

        </div>

        <!-- TABLA -->
        <div class="tabla-contenedor">

            <div class="tabla-header-mensualidad">

                <span>Estudiante</span>
                <span>Precio</span>
                <span>Fecha Límite</span>
                <span>Estado</span>
                <span>Acciones</span>

            </div>

            <div id="tablaMensualidad">

                <!-- JS -->

            </div>

        </div>

    </div>

</div>
<script src="js/alertas.js"></script>
<script src="js/mensualidad.js"></script>
<script src="js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>

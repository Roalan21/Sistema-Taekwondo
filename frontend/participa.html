<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inscribir Estudiantes - Taekwondo</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="contenido-pagina">
        <!-- Encabezado similar a estudiantes -->
        <div class="header-estudiantes">
            <div class="header-texto">
                <h1>👥 Inscribir Estudiantes a Evento</h1>
                <p id="infoEvento">Registra la participación de estudiantes en eventos</p>
            </div>
            <button class="btn-nuevo" id="btnVolver">
                ← Volver a Eventos
            </button>
        </div>

        <!-- Formulario de inscripción -->
        <div class="card-form" style="margin-bottom: 30px;">
            <form id="formParticipa" class="grid-form" style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 15px; align-items: end;">
                <div>
                    <label>Estudiante</label>
                    <select id="estudiante" required>
                        <option value="">Seleccione estudiante...</option>
                    </select>
                </div>
                <div>
                    <label>Evento</label>
                    <select id="evento" required>
                        <option value="">Seleccione evento...</option>
                    </select>
                </div>
                <button type="submit" class="btn-guardar" style="margin: 0; padding: 12px;">Registrar</button>
            </form>
        </div>

        <!-- Tabla de participantes -->
        <div class="tabla-header">
            <span>Estudiante</span>
            <span>Evento</span>
            <span>Fecha Registro</span>
            <span>Asistencia</span>
            <span>Resultado</span>
            <span>Acciones</span>
        </div>
        
        <div id="contenedor-participaciones"></div>
    </div>
    <script src="js/alertas.js"></script>
    <script src="js/participa.js"></script>
    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>

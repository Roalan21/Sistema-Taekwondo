<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Salidas de Productos - Taekwondo</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>

<div class="contenido-pagina">

    <div class="card-principal">

        <h2>Salidas de Productos</h2>

        <form id="formSalida">

            <label>Tipo de salida</label>
            <select id="tipoSalida">
                <option value="Venta">Venta</option>
                <option value="Regalia">Regalía</option>
                <option value="Promocion">Promoción</option>
            </select>

            <!-- 🔹 VENTA -->
            <div id="ventaCampos">

                <label>Producto</label>
                <select id="productoVenta"></select>
                
                <label>Método de Pago</label>
                <select id="metodoPago"></select>

                <label>Cantidad</label>
                <input type="number" id="cantidadVenta" placeholder="Cantidad">

                <label>Descuento (%)</label>
                <input type="number" id="descuentoVenta" placeholder="0" min="0" max="100">

                <label>Total calculado</label>
                <input type="text" id="totalCalculado" disabled>

                <label>Monto Final</label>
                <input type="number" id="MontoFinal" placeholder="Monto Final" step="0.01">

                <button type="button" id="agregarProducto">Agregar</button>

                <ul id="listaVenta"></ul>

                <button type="button" id="guardarVenta">Guardar Venta</button>

            </div>

            <!-- 🔹 REGALIA -->
            <div id="regaliaCampos" style="display:none;">

                <label>Destinatario</label>
                <input type="text" id="destinatario" placeholder="Destinatario">

                <label>Descripción</label>
                <input type="text" id="descripcionRegalia" placeholder="Descripción">

                <label>Producto</label>
                <select id="productoRegalia"></select>

                <label>Cantidad</label>
                <input type="number" id="cantidadRegalia">

                <button type="button" id="guardarRegalia">Guardar Regalía</button>

            </div>

            <!-- 🔹 PROMOCION -->
            <div id="promocionCampos" style="display:none;">

                <label>Tipo de promoción</label>
                <input type="text" id="tipoPromocion" placeholder="Tipo">

                <label>Fecha inicio</label>
                <input type="date" id="fechaInicio">

                <label>Fecha fin</label>
                <input type="date" id="fechaFin">

                <label>Precio promoción</label>
                <input type="number" id="PrecioPromocion">

                <label>Producto</label>
                <select id="productoPromocion"></select>

                <button type="button" id="guardarPromocion">Guardar Promoción</button>

            </div>

        </form>

    </div>

</div>

<script src="js/salidas.js"></script>
<script src="js/main.js"></script>

</body>
</html>
